<!DOCTYPE html>
<html>
<head>
    <title>JSON Data Display</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #3730a3;
        }

        button {
            padding: 10px 18px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #4f46e5;
            color: white;
        }
    </style>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="container">

    <h2>Vithika's JSON Data</h2>

    <button onclick="loadWithFetch()">Load using fetch()</button>
    <button onclick="loadWithJSON()">Load using $.getJSON()</button>

    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>PRN</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>
    </table>

</div>


<script>

    // JSON DATA
    let studentData = [
        {
            "id": 1,
            "name": "Vithika",
            "prn": "24070521192"
        },
        {
            "id": 2,
            "name": "Sharvari",
            "prn": "24070521207"
        },
        {
            "id": 3,
            "name": "Shreya",
            "prn": "24070521196"
        },
        {
            "id": 4,
            "name": "Rutva",
            "prn": "24070521189"
        },
        {
            "id": 5,
            "name": "Sanvi",
            "prn": "24070521196"
        },
        {
            "id": 6,
            "name": "doodle",
            "prn": "24070521000"
        }
    ];


    // DISPLAY DATA IN TABLE
    function displayData(data) {

        let tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        data.forEach(function(student) {

            let row = document.createElement("tr");

            row.innerHTML =
                "<td>" + student.id + "</td>" +
                "<td>" + student.name + "</td>" +
                "<td>" + student.prn + "</td>";

            tableBody.appendChild(row);
        });
    }


    // FETCH()
    function loadWithFetch() {

        let jsonFile = new Blob(
            [JSON.stringify(studentData)],
            { type: "application/json" }
        );

        let url = URL.createObjectURL(jsonFile);

        fetch(url)
            .then(response => response.json())
            .then(data => {
                displayData(data);
            })
            .catch(error => {
                console.log("Error:", error);
            });
    }


    // JQUERY $.getJSON()
    function loadWithJSON() {

        let jsonFile = new Blob(
            [JSON.stringify(studentData)],
            { type: "application/json" }
        );

        let url = URL.createObjectURL(jsonFile);

        $.getJSON(url, function(data) {

            displayData(data);

        }).fail(function() {

            console.log("Error loading JSON");

        });
    }

</script>

</body>
</html>
